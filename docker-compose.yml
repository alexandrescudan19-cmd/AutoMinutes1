services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "3500:3000"
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      MONGODB_URI: mongodb://mongo:27017/autominutes
      JWT_SECRET: change-me-in-production
      FRONTEND_URL: http://localhost:5173,http://localhost:8080
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      AUTO_IMPORT_MEET_TRANSCRIPTS: "false"
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_URL: http://localhost:3500
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo-data:
